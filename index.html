<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <title>Entrega Livre</title>
    <link rel="icon" type="image/svg+xml" href="/entrega-livre/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --brand:      #f59e0b;
        --brand-dark: #d97706;
        --brand-light:#fef3c7;
        --dark:       #0f1729;
        --dark2:      #1a253e;
        --dark3:      #243050;
        --text:       #1a253e;
        --text2:      #5a6789;
        --text3:      #9aa3bb;
        --bg:         #f4f6fb;
        --card:       #ffffff;
        --border:     #e8ecf4;
        --success:    #10b981;
        --error:      #ef4444;
        --warning:    #f59e0b;
        --radius-sm:  10px;
        --radius:     16px;
        --radius-lg:  24px;
        --shadow-sm:  0 2px 8px rgba(15,23,41,0.06);
        --shadow:     0 4px 20px rgba(15,23,41,0.10);
        --shadow-lg:  0 8px 40px rgba(15,23,41,0.14);
        --font:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-tap-highlight-color: transparent; }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #root { height: 100dvh; display: flex; flex-direction: column; }
      input, button, textarea, select { font-family: inherit; }
      button { cursor: pointer; }
      a { text-decoration: none; color: inherit; }

      /* Scrollbar fina */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

      /* Animações globais */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.05); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .anim-up  { animation: fadeUp 0.35s ease both; }
      .anim-in  { animation: fadeIn 0.25s ease both; }

      /* Spinner */
      .spinner {
        width: 22px; height: 22px;
        border: 3px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: inline-block;
      }

      /* Botões base */
      .btn {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        width: 100%; padding: 16px 20px;
        border-radius: var(--radius);
        border: none;
        font-size: 16px; font-weight: 700;
        transition: transform 0.1s, opacity 0.15s, box-shadow 0.15s;
        letter-spacing: 0.01em;
      }
      .btn:active { transform: scale(0.97); }
      .btn:disabled { opacity: 0.55; pointer-events: none; }
      .btn-primary { background: var(--brand); color: var(--dark); box-shadow: 0 4px 14px rgba(245,158,11,0.4); }
      .btn-primary:hover { background: var(--brand-dark); box-shadow: 0 6px 20px rgba(245,158,11,0.5); }
      .btn-ghost { background: rgba(255,255,255,0.12); color: #fff; border: 1.5px solid rgba(255,255,255,0.25); }
      .btn-ghost:hover { background: rgba(255,255,255,0.2); }
      .btn-outline { background: transparent; color: var(--brand); border: 2px solid var(--brand); }
      .btn-danger { background: var(--error); color: #fff; }
      .btn-sm { padding: 10px 16px; font-size: 14px; border-radius: var(--radius-sm); }

      /* Inputs base */
      .inp {
        width: 100%; padding: 14px 16px;
        border-radius: var(--radius-sm);
        border: 2px solid var(--border);
        background: #fff;
        font-size: 15px; color: var(--text);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .inp:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(245,158,11,0.12); }
      .inp::placeholder { color: var(--text3); }

      /* Cards */
      .card {
        background: var(--card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 20px;
      }

      /* Label */
      .lbl {
        display: block;
        font-size: 12px; font-weight: 700;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
      }

      /* Badge */
      .badge {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 4px 10px;
        border-radius: 99px;
        font-size: 12px; font-weight: 700;
      }
      .badge-warn  { background: var(--brand-light); color: #92400e; }
      .badge-blue  { background: #dbeafe; color: #1e40af; }
      .badge-green { background: #d1fae5; color: #065f46; }
      .badge-red   { background: #fee2e2; color: #991b1b; }
      .badge-dark  { background: var(--dark3); color: #fff; }

      /* Section title */
      .sect-title {
        font-size: 11px; font-weight: 700;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
      }

      /* Alert */
      .alert {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 14px; font-weight: 500;
        display: flex; align-items: center; gap: 8px;
      }
      .alert-error   { background: #fee2e2; color: #dc2626; }
      .alert-success { background: #d1fae5; color: #065f46; }
      .alert-warn    { background: var(--brand-light); color: #92400e; }

      /* Page shell */
      .page { display: flex; flex-direction: column; height: 100dvh; background: var(--bg); overflow: hidden; }
      .page-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

      /* Header */
      .page-header {
        background: var(--dark);
        padding: 16px 20px;
        padding-top: max(16px, env(safe-area-inset-top));
        display: flex; align-items: center; gap: 12px;
        color: #fff;
        flex-shrink: 0;
      }
      .page-header-title { font-size: 18px; font-weight: 800; flex: 1; }
      .page-header-sub   { font-size: 13px; opacity: 0.65; margin-top: 2px; }

      /* Bottom safe area */
      .pb-safe { padding-bottom: max(80px, calc(80px + env(safe-area-inset-bottom))); }

      /* Divider */
      .divider { height: 1px; background: var(--border); margin: 16px 0; }

      /* Form group */
      .form-group { margin-bottom: 16px; }

      /* Info row badges */
      .info-row { display: flex; gap: 10px; margin-bottom: 14px; }
      .info-badge {
        flex: 1; background: var(--bg);
        border-radius: var(--radius-sm);
        padding: 10px 12px; text-align: center;
        border: 1px solid var(--border);
      }
      .info-badge-val { font-size: 17px; font-weight: 800; color: var(--text); }
      .info-badge-lbl { font-size: 11px; color: var(--text3); margin-top: 3px; }
    </style>
    <script type="module" crossorigin src="/entrega-livre/assets/index-DwYYjePE.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
